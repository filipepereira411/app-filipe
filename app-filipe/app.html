<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Minha Aplicação Nativa</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        h1 { margin-top: 0; }
        button {
            background: #ffffff;
            color: #764ba2;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #f0f0f0; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Bem-vindo à App Nativa</h1>
        <p>Esta janela está a correr a partir de um ficheiro compilado dentro do .exe!</p>
        <button onclick="alert('Funciona a 100% offline!')">Testar Aplicação</button>
    </div>
</body>
</html>
